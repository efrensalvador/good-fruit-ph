name: Validate product template
on:
  push:
    paths: ['wp-content/plugins/gfe-industrial/**', '.github/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, Node.js 24
      - name: Check PHP and shell syntax
        run: |
          set -euo pipefail
          find wp-content/plugins/gfe-industrial .github/scripts -name '*.php' -print0 | xargs -0 -n1 php -l
          bash -n .github/scripts/deploy-product.sh
